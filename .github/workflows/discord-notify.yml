name: Discord Notifications

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, closed]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        run: |
          PAYLOAD=$(jq -n \
            --arg content "📢 **Repository:** ${{ github.repository }} \
            👤 **Actor:** ${{ github.actor }} \
            🧱 **Event:** ${{ github.event_name }} \
            🔗 [View on GitHub](${{ github.event.repository.html_url }})" \
            '{content: $content}')
          curl -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "${{ secrets.DISCORD_WEBHOOK }}"
